{% extends 'base.html' %}
{% load static %}
{% block titulo %}Entrar{% endblock %}

{% block cuerpo %}
<div class="ordo-login">
  <div class="card shadow-sm">
    <div class="card-body p-4 p-sm-5">
      <div class="text-center mb-4">
        <img src="{% static 'img/marca/ordo-logo-vertical-web.png' %}" alt="Ordo" class="ordo-logo-login">
        <p class="text-muted mt-3 mb-0">Sistema de gestión comercial</p>
      </div>

      {% if form.non_field_errors %}
        <div class="alert alert-danger py-2 small">Correo o contraseña incorrectos.</div>
      {% endif %}

      <form method="post" novalidate>
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
          <label for="{{ form.username.id_for_label }}" class="form-label">{{ form.username.label }}</label>
          {{ form.username }}
        </div>
        <div class="mb-4">
          <label for="{{ form.password.id_for_label }}" class="form-label">{{ form.password.label }}</label>
          {{ form.password }}
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100">Entrar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
