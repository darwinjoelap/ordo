{% extends 'base.html' %}
{% load static %}
{% block cuerpo %}
<div class="ordo-login">
  <div class="card shadow-sm">
    <div class="card-body p-4 text-center">
      <img src="{% static 'img/marca/ordo-simbolo-web.png' %}" alt="Ordo" style="height:56px">
      <h1 class="h5 mt-3">Tu usuario no tiene una empresa asignada</h1>
      <p class="text-muted">Pide al administrador de tu empresa que te agregue, o escribe a soporte de Ordo.</p>
      {% if user.is_staff %}
        <a href="{% url 'admin:empresas_empresa_changelist' %}" class="btn btn-outline-primary mb-2 w-100">
          <i class="bi bi-building-add me-1"></i> Crear o asignar empresa (admin)
        </a>
      {% endif %}
      <form method="post" action="{% url 'usuarios:logout' %}">
        {% csrf_token %}
        <button class="btn btn-link">Cerrar sesión</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
