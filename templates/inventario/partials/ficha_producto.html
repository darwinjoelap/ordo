{% load ordo %}
<div class="card card-body mb-3 d-flex flex-row justify-content-between align-items-center gap-2">
  <div class="min-w-0">
    <div class="small text-muted">Producto</div>
    <div class="fw-semibold text-truncate">{{ producto.nombre }}</div>
    <div class="small text-muted"><code>{{ producto.codigo }}</code> · disponible {{ producto.stock_disponible|miles }} {{ producto.unidad.abreviatura }}
      {% if producto.maneja_lotes %} · <span class="badge text-bg-light border">Lote</span>{% endif %}
      {% if producto.maneja_vencimiento %} <span class="badge text-bg-light border">Vencimiento</span>{% endif %}</div>
  </div>
  <a href="{{ request.path }}" class="btn btn-outline-secondary btn-sm flex-shrink-0">Cambiar</a>
</div>
